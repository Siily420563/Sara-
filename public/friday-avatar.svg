<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Space Cyber Dark) -->
    <radialGradient id="fridayBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="35%" stop-color="#021d1d"/>
      <stop offset="70%" stop-color="#011011"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Arc Reactor Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#5eead4"/>
      <stop offset="65%" stop-color="#14b8a6"/>
      <stop offset="90%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hologramAmbient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Armor Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Holographic Cyan Beam Lines -->
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>

    <filter id="coreBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#fridayBg)"/>

  <!-- Ambient Hologram Sphere -->
  <circle cx="256" cy="256" r="230" fill="url(#hologramAmbient)"/>

  <!-- Background HUD Compass / Telemetry Rings -->
  <g opacity="0.3" stroke="#2dd4bf" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="220" stroke-dasharray="6, 12"/>
    <circle cx="256" cy="256" r="195" stroke-dasharray="16, 8, 4, 8"/>
    <circle cx="256" cy="256" r="170" stroke-dasharray="2, 6"/>
  </g>

  <!-- Grid Reticles / Crosshairs -->
  <g stroke="#14b8a6" stroke-width="1.2" opacity="0.4">
    <line x1="256" y1="20" x2="256" y2="80"/>
    <line x1="256" y1="432" x2="256" y2="492"/>
    <line x1="20" y1="256" x2="80" y2="256"/>
    <line x1="432" y1="256" x2="492" y2="256"/>
  </g>

  <!-- Outer Armored AI Core Rings -->
  <circle cx="256" cy="256" r="145" fill="url(#chassisGrad)" stroke="#14b8a6" stroke-width="3" filter="url(#softGlow)"/>
  
  <!-- Circuit Nodes Around Core -->
  <g fill="#2dd4bf" opacity="0.8">
    <circle cx="256" cy="115" r="4.5"/>
    <circle cx="256" cy="397" r="4.5"/>
    <circle cx="115" cy="256" r="4.5"/>
    <circle cx="397" cy="256" r="4.5"/>
    <circle cx="156" cy="156" r="3.5"/>
    <circle cx="356" cy="156" r="3.5"/>
    <circle cx="156" cy="356" r="3.5"/>
    <circle cx="356" cy="356" r="3.5"/>
  </g>

  <!-- High-Tech Hexagonal AI Processor Lattice -->
  <polygon points="256,135 360,195 360,317 256,377 152,317 152,195" fill="#042f2e" stroke="#2dd4bf" stroke-width="2.5" opacity="0.85"/>
  <polygon points="256,150 345,202 345,310 256,362 167,310 167,202" fill="#021d1d" stroke="#5eead4" stroke-width="1.8" opacity="0.9"/>

  <!-- Rotating Arc Reactor Turbine Petals -->
  <g fill="#0d9488" stroke="#5eead4" stroke-width="1.5" opacity="0.85">
    <!-- 8 Reactor Fins -->
    <path d="M 256 165 L 268 215 L 244 215 Z"/>
    <path d="M 256 347 L 268 297 L 244 297 Z"/>
    <path d="M 165 256 L 215 244 L 215 268 Z"/>
    <path d="M 347 256 L 297 244 L 297 268 Z"/>
    <!-- Diagonals -->
    <path d="M 192 192 L 232 222 L 218 238 Z"/>
    <path d="M 320 192 L 298 238 L 280 222 Z"/>
    <path d="M 192 320 L 218 274 L 232 290 Z"/>
    <path d="M 320 320 L 280 290 L 298 274 Z"/>
  </g>

  <!-- Central Super-Bright Quantum Core (F.R.I.D.A.Y. Consciousness Node) -->
  <circle cx="256" cy="256" r="75" fill="#042f2e" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="256" cy="256" r="60" fill="url(#coreGlow)" filter="url(#coreBlur)"/>
  <circle cx="256" cy="256" r="42" fill="#5eead4" opacity="0.95"/>
  <circle cx="256" cy="256" r="28" fill="#ffffff"/>

  <!-- Futuristic Hologram Scanlines -->
  <g opacity="0.25" stroke="#a7f3d0" stroke-width="1">
    <line x1="160" y1="230" x2="352" y2="230"/>
    <line x1="155" y1="242" x2="357" y2="242"/>
    <line x1="152" y1="256" x2="360" y2="256"/>
    <line x1="155" y1="270" x2="357" y2="270"/>
    <line x1="160" y1="282" x2="352" y2="282"/>
  </g>

  <!-- Telemetry HUD Text & Badges -->
  <text x="256" y="90" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="4" opacity="0.9">
    F.R.I.D.A.Y. // ONLINE
  </text>
  <text x="256" y="440" fill="#5eead4" font-family="monospace" font-size="10" font-weight="semibold" text-anchor="middle" letter-spacing="3" opacity="0.8">
    SYSTEMS: 100% OPTIMAL
  </text>

  <!-- Corner Tech Bracket Marks -->
  <g stroke="#2dd4bf" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M 50 80 L 50 50 L 80 50"/>
    <path d="M 462 80 L 462 50 L 432 50"/>
    <path d="M 50 432 L 50 462 L 80 462"/>
    <path d="M 462 432 L 462 462 L 432 462"/>
  </g>
</svg>
