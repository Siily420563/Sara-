<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Atmospheric Glow -->
    <radialGradient id="bgGlow" cx="20%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="40%" stop-color="#071526"/>
      <stop offset="80%" stop-color="#030810"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="leftRimGlow" cx="15%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#1E6091" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0E2A47" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair Base & Highlights -->
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3B"/>
      <stop offset="35%" stop-color="#111A29"/>
      <stop offset="70%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="hairHighlightLeft" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="crownShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1E2A3B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A101D" stop-opacity="0"/>
    </linearGradient>

    <!-- Skin & Lighting Gradients -->
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E8"/>
      <stop offset="60%" stop-color="#FDE6D2"/>
      <stop offset="100%" stop-color="#F2CBB0"/>
    </linearGradient>

    <linearGradient id="skinRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#7DD3FC" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Eye Gradients (Warm Amber Brown) -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="30%" stop-color="#78350F"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shirt Gradients (Light Blue Button Up) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="35%" stop-color="#7DD3FC"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="shirtRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7DD3FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Blur Filter -->
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Left Side Blue Light Haze -->
  <circle cx="90" cy="220" r="220" fill="url(#leftRimGlow)"/>
  <circle cx="60" cy="180" r="140" fill="#38BDF8" opacity="0.12" filter="url(#glowBlur)"/>

  <!-- Back Hair Volume -->
  <path d="M 125 180 C 110 260, 118 360, 138 440 L 374 440 C 394 360, 402 260, 387 180 C 375 120, 330 65, 256 65 C 182 65, 137 120, 125 180 Z" fill="url(#hairBase)"/>

  <!-- Shoulders & Light Blue Shirt -->
  <g id="body">
    <!-- Shirt Base -->
    <path d="M 90 512 L 90 435 C 90 395, 165 355, 256 355 C 347 355, 422 395, 422 435 L 422 512 Z" fill="url(#shirtGrad)"/>
    
    <!-- Left Shoulder Rim Light -->
    <path d="M 90 512 L 90 435 C 90 395, 165 355, 256 355 C 200 365, 120 410, 105 512 Z" fill="url(#shirtRimLight)"/>

    <!-- Neck Shadow -->
    <path d="M 216 310 L 296 310 L 312 370 C 275 385, 237 385, 200 370 Z" fill="#D29F80" opacity="0.75"/>
    <path d="M 200 325 C 225 340, 287 340, 312 325 L 305 370 C 270 382, 242 382, 207 370 Z" fill="#2563EB" opacity="0.15"/>

    <!-- Neck Base -->
    <path d="M 218 300 L 294 300 L 298 360 C 270 372, 242 372, 214 360 Z" fill="url(#skinGrad)"/>

    <!-- Shirt Collar Left -->
    <path d="M 190 355 L 246 425 L 256 380 L 216 355 Z" fill="#38BDF8"/>
    <path d="M 190 355 L 246 425 L 256 380 Z" fill="#E0F2FE" opacity="0.6"/>

    <!-- Shirt Collar Right -->
    <path d="M 322 355 L 266 425 L 256 380 L 296 355 Z" fill="#0284C7"/>

    <!-- Front Placket & Buttons -->
    <path d="M 256 380 L 256 512" stroke="#1E3A8A" stroke-width="2.5" opacity="0.4"/>
    <path d="M 250 380 L 262 380 L 262 512 L 250 512 Z" fill="#38BDF8" opacity="0.3"/>
    
    <!-- Collar Buttons -->
    <circle cx="256" cy="448" r="4.5" fill="#1E3A8A"/>
    <circle cx="256" cy="448" r="3" fill="#E0F2FE"/>
    <circle cx="256" cy="495" r="4.5" fill="#1E3A8A"/>
    <circle cx="256" cy="495" r="3" fill="#E0F2FE"/>
  </g>

  <!-- Face Base -->
  <g id="head">
    <path d="M 162 170 C 162 110, 204 95, 256 95 C 308 95, 350 110, 350 170 C 350 238, 318 310, 256 310 C 194 310, 162 238, 162 170 Z" fill="url(#skinGrad)"/>
    
    <!-- Left Jaw Blue Rim Light Shading -->
    <path d="M 162 170 C 162 238, 194 310, 256 310 C 230 300, 172 245, 170 170 Z" fill="url(#skinRimLight)"/>

    <!-- Cheek Blush -->
    <ellipse cx="198" cy="235" rx="20" ry="9" fill="#F43F5E" opacity="0.18"/>
    <ellipse cx="314" cy="235" rx="20" ry="9" fill="#F43F5E" opacity="0.18"/>

    <!-- Left Eye -->
    <g id="left-eye">
      <ellipse cx="208" cy="212" rx="18" ry="24" fill="#0A0A0A"/>
      <ellipse cx="208" cy="213" rx="16" ry="22" fill="url(#irisGrad)"/>
      <ellipse cx="208" cy="216" rx="11" ry="14" fill="#1C0A00"/>
      <!-- Inner Glow -->
      <path d="M 196 222 C 202 232, 214 232, 220 222 C 214 226, 202 226, 196 222 Z" fill="#F59E0B" opacity="0.8"/>
      <!-- Catchlights -->
      <ellipse cx="201" cy="202" rx="7.5" ry="8.5" fill="#FFFFFF"/>
      <circle cx="215" cy="222" r="3.5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="202" cy="220" r="2" fill="#FFFFFF" opacity="0.7"/>
      <!-- Upper Eyelash Line -->
      <path d="M 186 195 C 202 184, 222 186, 230 196" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 186 195 C 202 184, 222 186, 230 196" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Right Eye -->
    <g id="right-eye">
      <ellipse cx="304" cy="212" rx="18" ry="24" fill="#0A0A0A"/>
      <ellipse cx="304" cy="213" rx="16" ry="22" fill="url(#irisGrad)"/>
      <ellipse cx="304" cy="216" rx="11" ry="14" fill="#1C0A00"/>
      <!-- Inner Glow -->
      <path d="M 292 222 C 298 232, 310 232, 316 222 C 310 226, 298 226, 292 222 Z" fill="#F59E0B" opacity="0.8"/>
      <!-- Catchlights -->
      <ellipse cx="297" cy="202" rx="7.5" ry="8.5" fill="#FFFFFF"/>
      <circle cx="311" cy="222" r="3.5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="298" cy="220" r="2" fill="#FFFFFF" opacity="0.7"/>
      <!-- Upper Eyelash Line -->
      <path d="M 282 196 C 290 186, 310 184, 326 195" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Soft Eyebrows -->
    <path d="M 188 178 C 202 170, 222 172, 228 178" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 284 178 C 290 172, 310 170, 324 178" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Petite Nose -->
    <path d="M 254 228 L 258 236 L 253 238" stroke="#D29F80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Gentle Open Smile -->
    <g id="mouth">
      <!-- Outer smile curve -->
      <path d="M 232 260 C 242 276, 270 276, 280 260 C 270 282, 242 282, 232 260 Z" fill="#9F1239"/>
      <!-- Upper teeth -->
      <path d="M 235 261 C 245 268, 267 268, 277 261 C 272 265, 240 265, 235 261 Z" fill="#FFFFFF"/>
      <!-- Tongue detail -->
      <path d="M 244 274 C 252 270, 260 270, 268 274 C 264 280, 248 280, 244 274 Z" fill="#FB7185"/>
      <!-- Mouth Corners -->
      <path d="M 230 260 C 234 261, 235 262, 235 264" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
      <path d="M 282 260 C 278 261, 277 262, 277 264" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Front Hair Bob Cut & Bangs -->
  <g id="front-hair">
    <!-- Left Side Lock Framing Face -->
    <path d="M 165 140 C 150 180, 142 230, 148 280 C 152 310, 168 340, 182 355 C 190 345, 176 300, 172 260 C 168 200, 178 160, 188 135 Z" fill="url(#hairBase)"/>
    
    <!-- Left Lock Blue Rim Light -->
    <path d="M 165 140 C 150 180, 142 230, 148 280 C 152 310, 168 340, 182 355 C 172 340, 158 300, 154 260 C 150 200, 160 160, 165 140 Z" fill="url(#hairHighlightLeft)"/>

    <!-- Right Side Lock Framing Face -->
    <path d="M 347 140 C 362 180, 370 230, 364 280 C 360 310, 344 340, 330 355 C 322 345, 336 300, 340 260 C 344 200, 334 160, 324 135 Z" fill="url(#hairBase)"/>
    <path d="M 347 140 C 358 180, 364 230, 358 280 C 354 305, 340 330, 330 345 C 336 330, 348 290, 350 250 C 352 200, 345 160, 347 140 Z" fill="#1D4ED8" opacity="0.3"/>

    <!-- Front Bangs Sweep -->
    <path d="M 170 120 C 190 160, 215 175, 232 125 C 242 170, 272 170, 282 125 C 292 170, 322 155, 342 120 C 315 80, 275 68, 256 68 C 220 68, 188 80, 170 120 Z" fill="url(#hairBase)"/>

    <!-- Crown & Bangs Highlights -->
    <path d="M 175 115 C 205 85, 250 78, 288 88" stroke="url(#hairHighlightLeft)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 188 128 C 210 102, 245 98, 275 106" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Subtle Strand Highlights on Bangs -->
    <path d="M 210 135 C 218 152, 224 160, 228 140" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M 252 135 C 260 152, 268 158, 274 140" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.6"/>
  </g>

  <!-- Sparkle Detail at Bottom Right (Subtle 4-point Star) -->
  <g id="sparkle" transform="translate(450, 460)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#BAE6FD" opacity="0.85"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>
