<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="venomBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#180408"/>
      <stop offset="45%" stop-color="#0a0204"/>
      <stop offset="85%" stop-color="#020102"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Venom Skin Gradient (Onyx Symbiote Sheen) -->
    <linearGradient id="symbioteSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="35%" stop-color="#14171f"/>
      <stop offset="75%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Crimson & Purple Ambient Rim Lights -->
    <radialGradient id="crimsonGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <filter id="venomGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="eyeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#venomBg)"/>

  <!-- Ambient Glow Behind Head -->
  <circle cx="256" cy="220" r="180" fill="#e11d48" opacity="0.18" filter="url(#venomGlowFilter)"/>
  <circle cx="120" cy="180" r="130" fill="url(#crimsonGlow)"/>

  <!-- Symbiote Tendrils & Trapezius / Shoulders -->
  <g id="venom-shoulders">
    <path d="M 60 512 C 70 410, 140 370, 256 370 C 372 370, 442 410, 452 512 Z" fill="url(#symbioteSkin)"/>
    <!-- Tendril spikes left -->
    <path d="M 90 420 Q 50 360 70 310 Q 95 360 130 395 Z" fill="#14171f"/>
    <path d="M 60 480 Q 20 440 30 390 Q 60 430 85 450 Z" fill="#0d1117"/>
    <!-- Tendril spikes right -->
    <path d="M 422 420 Q 462 360 442 310 Q 417 360 382 395 Z" fill="#14171f"/>
    <path d="M 452 480 Q 492 440 482 390 Q 452 430 427 450 Z" fill="#0d1117"/>
    <!-- Muscular Neck Base -->
    <path d="M 180 340 L 332 340 L 320 400 C 280 415, 232 415, 192 400 Z" fill="#090b0e"/>
  </g>

  <!-- Venom Head Structure -->
  <g id="venom-head">
    <!-- Main Skull Shape -->
    <path d="M 130 200 C 120 100, 180 50, 256 50 C 332 50, 392 100, 382 200 C 375 280, 335 360, 256 360 C 177 360, 137 280, 130 200 Z" fill="url(#symbioteSkin)"/>
    
    <!-- Brow & Jaw Musculature Highlights -->
    <path d="M 170 120 C 220 90, 292 90, 342 120 C 310 100, 202 100, 170 120 Z" fill="#3b4252" opacity="0.6"/>
    <path d="M 150 170 C 180 150, 220 150, 240 170 C 210 160, 170 160, 150 170 Z" fill="#4c566a" opacity="0.4"/>
    <path d="M 362 170 C 332 150, 292 150, 272 170 C 302 160, 342 160, 362 170 Z" fill="#4c566a" opacity="0.4"/>

    <!-- Venom Iconic Jagged Symbiote Eyes (White with Soft Blue/Onyx Edge) -->
    <!-- Left Eye -->
    <g id="left-venom-eye" filter="url(#eyeBlur)">
      <path d="M 160 175 C 170 135, 230 145, 248 190 C 235 225, 205 255, 172 250 C 158 230, 152 200, 160 175 Z" fill="#ffffff"/>
    </g>
    <path d="M 160 175 C 170 135, 230 145, 248 190 C 235 225, 205 255, 172 250 C 158 230, 152 200, 160 175 Z" fill="url(#eyeGlow)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Eye Jagged Symbiote Webbing inside -->
    <path d="M 180 170 Q 210 185 235 190" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 170 210 Q 195 225 220 220" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Right Eye -->
    <g id="right-venom-eye" filter="url(#eyeBlur)">
      <path d="M 352 175 C 342 135, 282 145, 264 190 C 277 225, 307 255, 340 250 C 354 230, 360 200, 352 175 Z" fill="#ffffff"/>
    </g>
    <path d="M 352 175 C 342 135, 282 145, 264 190 C 277 225, 307 255, 340 250 C 354 230, 360 200, 352 175 Z" fill="url(#eyeGlow)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Eye Jagged Symbiote Webbing inside -->
    <path d="M 332 170 Q 302 185 277 190" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 342 210 Q 317 225 292 220" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Menacing Wide Tooth-Filled Grin / Mouth -->
    <g id="venom-mouth">
      <!-- Black Mouth Cavity -->
      <path d="M 160 280 C 190 345, 322 345, 352 280 C 322 300, 190 300, 160 280 Z" fill="#030304"/>
      <!-- Inner Dark Crimson Gums -->
      <path d="M 170 284 C 200 335, 312 335, 342 284 C 315 296, 195 296, 170 284 Z" fill="#4c0519" opacity="0.8"/>

      <!-- Upper Needle Fangs -->
      <!-- Teeth Left to Right -->
      <polygon points="175,282 182,282 178,296" fill="#f8fafc"/>
      <polygon points="186,283 194,283 190,300" fill="#f8fafc"/>
      <polygon points="198,284 207,284 202,304" fill="#ffffff"/>
      <polygon points="211,285 221,285 216,307" fill="#ffffff"/>
      <polygon points="225,286 235,286 230,309" fill="#ffffff"/>
      <polygon points="239,286 249,286 244,310" fill="#ffffff"/>
      <polygon points="253,286 263,286 258,310" fill="#ffffff"/>
      <polygon points="267,286 277,286 272,309" fill="#ffffff"/>
      <polygon points="281,285 291,285 286,307" fill="#ffffff"/>
      <polygon points="295,284 304,284 300,304" fill="#ffffff"/>
      <polygon points="308,283 316,283 312,300" fill="#f8fafc"/>
      <polygon points="320,282 327,282 324,296" fill="#f8fafc"/>

      <!-- Lower Needle Fangs -->
      <polygon points="180,314 187,314 184,300" fill="#f8fafc"/>
      <polygon points="192,320 200,320 196,304" fill="#ffffff"/>
      <polygon points="205,325 214,325 209,308" fill="#ffffff"/>
      <polygon points="219,328 228,328 223,310" fill="#ffffff"/>
      <polygon points="233,330 242,330 237,312" fill="#ffffff"/>
      <polygon points="247,331 256,331 251,313" fill="#ffffff"/>
      <polygon points="261,331 270,331 265,313" fill="#ffffff"/>
      <polygon points="275,330 284,330 279,312" fill="#ffffff"/>
      <polygon points="289,328 298,328 293,310" fill="#ffffff"/>
      <polygon points="303,325 312,325 307,308" fill="#ffffff"/>
      <polygon points="317,320 325,320 321,304" fill="#ffffff"/>
      <polygon points="330,314 337,314 334,300" fill="#f8fafc"/>

      <!-- Symbiote Saliva Strand -->
      <path d="M 230 300 Q 235 315 233 330" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
      <path d="M 276 300 Q 272 315 275 330" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </g>
  </g>

  <!-- Symbiote Tendril Tendons Swirling Up Sides -->
  <path d="M 125 320 Q 95 240 115 160 Q 110 230 135 300 Z" fill="#14171f" opacity="0.7"/>
  <path d="M 387 320 Q 417 240 397 160 Q 402 230 377 300 Z" fill="#14171f" opacity="0.7"/>

  <!-- Venom Logo / Text Emblem at Top Corner -->
  <g id="venom-symbol" transform="translate(256, 470) scale(0.65)">
    <path d="M -80 -20 Q 0 -60 80 -20 Q 50 25 0 60 Q -50 25 -80 -20 Z" fill="#e11d48" opacity="0.8"/>
    <path d="M -60 -15 Q 0 -45 60 -15 Q 35 20 0 45 Q -35 20 -60 -15 Z" fill="#ffffff"/>
  </g>
</svg>
