<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bfBgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Indigo/Cyan Ambient Light -->
    <radialGradient id="bfRimGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="bfHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="35%" stop-color="#1a202c"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="bfHairHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </linearGradient>

    <!-- Skin Gradients (Warm Indian Tan/Olive) -->
    <linearGradient id="bfSkinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffd8be"/>
      <stop offset="60%" stop-color="#f5c29f"/>
      <stop offset="100%" stop-color="#d99b73"/>
    </linearGradient>

    <!-- Jacket & Hoodie Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <filter id="bfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bfBgGlow)"/>

  <!-- Indigo Ambient Light -->
  <circle cx="100" cy="180" r="200" fill="url(#bfRimGlow)"/>
  <circle cx="400" cy="200" r="160" fill="#6366f1" opacity="0.08" filter="url(#bfGlow)"/>

  <!-- Back Hair Volume -->
  <path d="M 140 180 C 130 250, 140 310, 160 350 L 352 350 C 372 310, 382 250, 372 180 C 360 110, 320 60, 256 60 C 192 60, 152 110, 140 180 Z" fill="url(#bfHairGrad)"/>

  <!-- Shoulders & Outfit (Casual Denim Jacket over Indigo Hoodie) -->
  <g id="bf-body">
    <!-- Denim Jacket Base -->
    <path d="M 75 512 L 75 425 C 75 380, 155 345, 256 345 C 357 345, 437 380, 437 425 L 437 512 Z" fill="url(#jacketGrad)"/>
    
    <!-- Left Shoulder Rim Light -->
    <path d="M 75 512 L 75 425 C 75 380, 145 350, 210 360 C 140 395, 90 440, 85 512 Z" fill="#818cf8" opacity="0.35"/>

    <!-- Inner Hoodie Collar & V-Neck -->
    <path d="M 190 355 L 256 450 L 322 355 C 290 375, 222 375, 190 355 Z" fill="url(#hoodieGrad)"/>

    <!-- Neck Shadow -->
    <path d="M 216 300 L 296 300 L 306 360 C 275 375, 237 375, 206 360 Z" fill="#b47b56" opacity="0.8"/>

    <!-- Neck Base -->
    <path d="M 218 290 L 294 290 L 296 350 C 270 362, 242 362, 216 350 Z" fill="url(#bfSkinGrad)"/>

    <!-- Adam's Apple Shadow -->
    <path d="M 252 324 L 256 332 L 260 324 Z" fill="#b47b56" opacity="0.6"/>

    <!-- Jacket Lapel Left -->
    <path d="M 160 370 L 215 470 L 256 420 L 205 355 Z" fill="#312e81"/>
    <!-- Jacket Lapel Right -->
    <path d="M 352 370 L 297 470 L 256 420 L 307 355 Z" fill="#1e1b4b"/>

    <!-- Pendant Chain -->
    <path d="M 228 355 Q 256 405 284 355" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="256" cy="405" r="4" fill="#e2e8f0"/>
  </g>

  <!-- Head & Facial Features -->
  <g id="bf-head">
    <!-- Jawline & Head Structure -->
    <path d="M 168 170 C 168 115, 204 95, 256 95 C 308 95, 344 115, 344 170 C 344 235, 310 295, 256 300 C 202 295, 168 235, 168 170 Z" fill="url(#bfSkinGrad)"/>

    <!-- Left Jaw Rim Light -->
    <path d="M 168 170 C 168 235, 202 295, 256 300 C 220 290, 175 235, 172 170 Z" fill="#818cf8" opacity="0.25"/>

    <!-- Subtle Stubble / Beard Shadow along jawline -->
    <path d="M 180 230 C 185 275, 220 298, 256 298 C 292 298, 327 275, 332 230 C 322 280, 290 292, 256 292 C 222 292, 190 280, 180 230 Z" fill="#1e293b" opacity="0.12"/>

    <!-- Left Eye -->
    <g id="bf-left-eye">
      <ellipse cx="212" cy="204" rx="16" ry="12" fill="#0f172a"/>
      <ellipse cx="212" cy="204" rx="14" ry="11" fill="#451a03"/>
      <circle cx="212" cy="204" r="7" fill="#1c0a00"/>
      <!-- Highlights -->
      <ellipse cx="207" cy="200" rx="4.5" ry="3.5" fill="#ffffff"/>
      <circle cx="216" cy="206" r="2" fill="#ffffff" opacity="0.8"/>
      <!-- Upper Eyelid & Lash Line -->
      <path d="M 194 198 C 206 190, 222 192, 230 200" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Right Eye -->
    <g id="bf-right-eye">
      <ellipse cx="300" cy="204" rx="16" ry="12" fill="#0f172a"/>
      <ellipse cx="300" cy="204" rx="14" ry="11" fill="#451a03"/>
      <circle cx="300" cy="204" r="7" fill="#1c0a00"/>
      <!-- Highlights -->
      <ellipse cx="295" cy="200" rx="4.5" ry="3.5" fill="#ffffff"/>
      <circle cx="304" cy="206" r="2" fill="#ffffff" opacity="0.8"/>
      <!-- Upper Eyelid & Lash Line -->
      <path d="M 282 200 C 290 192, 306 190, 318 198" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Masculine Defined Eyebrows -->
    <path d="M 190 182 C 205 172, 225 174, 234 180" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 278 180 C 287 174, 307 172, 322 182" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Sharp Clean Nose -->
    <path d="M 252 195 L 250 230 L 257 236 L 247 238" stroke="#b47b56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Confident Warm Smile -->
    <g id="bf-mouth">
      <path d="M 230 262 C 242 274, 270 274, 282 262" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Lower Lip Fullness -->
      <path d="M 238 266 C 248 274, 264 274, 274 266" stroke="#b47b56" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>
  </g>

  <!-- Modern Gen-Z Quiff / Undercut Hair -->
  <g id="bf-hair">
    <!-- Side Fades -->
    <path d="M 165 170 C 160 140, 165 115, 185 100 C 170 125, 170 155, 175 180 Z" fill="#1e293b" opacity="0.9"/>
    <path d="M 347 170 C 352 140, 347 115, 327 100 C 342 125, 342 155, 337 180 Z" fill="#1e293b" opacity="0.9"/>

    <!-- Top Voluminous Quiff -->
    <path d="M 172 110 C 180 60, 230 45, 270 52 C 315 60, 345 85, 340 120 C 320 85, 275 75, 240 85 C 200 95, 180 115, 172 110 Z" fill="url(#bfHairGrad)"/>
    
    <!-- Hair Volume Top Left Sweep -->
    <path d="M 180 100 C 205 55, 260 48, 290 65 C 260 60, 215 70, 195 95 Z" fill="url(#bfHairHighlight)"/>

    <!-- Front Strands Sweeping Across Forehead -->
    <path d="M 185 95 C 220 75, 270 80, 305 105 C 280 95, 240 90, 205 105 Z" fill="#1e293b"/>
    <path d="M 210 90 C 240 75, 280 82, 310 110" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Cool Ear Stud Left Ear -->
  <circle cx="166" cy="225" r="2.5" fill="#ffffff"/>
  <circle cx="166" cy="225" r="4" fill="#818cf8" opacity="0.4"/>
</svg>
